
<mat-card>
    <ul class="list-group" *ngIf="getTodos.length>0; else noTodos">
    <li class="list-group-item  d-flex justify-content-between" *ngFor="let todo of getTodos">
     <strong>
        {{todo.todoItem}}
     </strong>
     <div>
        <button
        (click)="onEidttodo(todo)"
        mat-fab color="primary" class="mr-2">
          <mat-icon>edit</mat-icon>
        </button>
        
         <button
         (click)="onTodoRemove(todo.todoId)"
         mat-fab color="warn">
          <mat-icon>delete</mat-icon>
        </button>

     </div>
    </li>
</ul>

<ng-template #noTodos> 
    <p class="alert alert-info">
        No Todos Data available!!!!
    </p>
</ng-template>
</mat-card>
