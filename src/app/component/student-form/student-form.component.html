<mat-card>
    <h2><strong>{{isInEditMode?'Update Student' : 'Add Student'}}</strong></h2>
    <div class="card">
        <div class="card-body">
            <div class="form-group">
                <label for="name"><Strong>Name</Strong></label>
                <input type="text" #name class="form-control">
            </div>
            <div class="form-group">
                <label for="age"><Strong>Age</Strong></label>
                <input type="text" #age class="form-control">
            </div>
            <div class="form-group">
                <label for="course"><Strong>Course</Strong></label>
                <input type="text" #course class="form-control">
            </div>
            <div class="form-group">
                <label for="city"><Strong>City</Strong></label>
                <input type="text" #city class="form-control">
            </div>

            <div class="form-group">
                <button
                *ngIf="!isInEditMode" (click)="OnAddStudent()" mat-raised-button color="primary"
                    class="d-flex justify-content-between">
                    Add Student </button>
            </div>
            <button *ngIf="isInEditMode" (click)="OnUpdateStudent()" mat-raised-button color="warn"
                class="d-flex justify-content-between">
                Update Student </button>


        </div>

    </div>
</mat-card>
